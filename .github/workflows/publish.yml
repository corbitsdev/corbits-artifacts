name: publish

# Tags are the release trigger: `v0.1.0` publishes whatever
# packages/artifact-core/package.json says version 0.1.0 is.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artifact_core
        ports: ["5457:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ARTIFACT_DATABASE_URL: postgres://postgres:postgres@localhost:5457/artifact_core

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # The tag and the manifest must agree, or the tag is a lie about what
      # got published.
      - name: verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/artifact-core/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi

      - run: bun run --cwd packages/artifact-core test
      - run: bun run build

      - name: publish
        run: npm publish --access public --provenance
        working-directory: packages/artifact-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
